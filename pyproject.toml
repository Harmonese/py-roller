[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "py-roller"
version = "0.10.1"
description = "English plain-lyrics alignment with Whisper large-v3, CTC timing and protocol v2."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "Harmonese" }]
keywords = [
  "lyrics",
  "subtitle",
  "karaoke",
  "alignment",
  "audio",
  "lrc",
  "cli",
  "transcription",
  "music",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = [
  "cmudict>=1.0,<2",
  "numpy>=1.24",
  "torch>=2.6",
  "transformers>=4.57,<5",
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=0.34,<1",
]

[project.optional-dependencies]
vocals = ["demucs>=4,<5", "torchaudio>=2.1"]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "numpy>=1.24",
  "soundfile>=0.12",
  "jsonschema>=4.23,<5",
]
release = ["build>=1.2", "twine>=6", "pybind11>=2.12"]

[project.scripts]
py-roller = "pyroller.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["pyroller", "pyroller.backends", "pyroller.hybrid", "pyroller.hybrid.vendor_power"]

[tool.setuptools.package-data]
"pyroller.hybrid.vendor_power" = ["LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not network and not runtime'"
markers = [
  "slow: slow tests that are not suitable for the default feedback loop",
  "network: tests that require network access",
  "runtime: tests that require the full audio/model runtime stack",
]

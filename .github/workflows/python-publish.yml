name: Build and publish package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_release.py dist
          python -m twine check dist/*
      - name: Install wheel and test outside the checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install numpy cmudict pytest jsonschema
          cp -R tests "$RUNNER_TEMP/tests"
          cp -R docs "$RUNNER_TEMP/docs"
          cd "$RUNNER_TEMP"
          python -m pyroller --version
          python -m pyroller align --help
          python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/py-roller/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Validate tag and stage source distribution
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = v0.10.2
          mkdir publish
          cp dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-cov numpy cmudict jsonschema

      - name: Run default test suite
        run: pytest --cov=pyroller --cov-report=term-missing

      - name: Check new entrypoint
        run: |
          python -m pyroller --version
          python -m pyroller align --help
